name: relay

x-app: &app
  build: .
  image: relay:local
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://relay:relay@postgres:5432/relay
    KAFKA_BROKERS: redpanda:9092
    REDIS_URL: redis://redis:6379
    TOPIC_PARTITIONS: '24'
    LOG_FORMAT: json

x-mock: &mock
  image: relay:local
  restart: unless-stopped
  command: ['node', 'dist/mock-provider/main.js']
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  # --- infrastructure -------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --smp 2
      - --memory 2G
      - --mode dev-container
      - --default-log-level=warn
    ports: ['19092:19092']
    healthcheck:
      test: ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      retries: 20

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ['8081:8080']
    depends_on: [redpanda]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    command: ['postgres', '-c', 'max_connections=300', '-c', 'shared_buffers=512MB', '-c', 'synchronous_commit=on']
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay']
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      retries: 20

  # --- relay ----------------------------------------------------------------------------
  migrate:
    <<: *app
    restart: 'no'
    environment:
      <<: *app-env
      APP_ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: api
      DATABASE_POOL_SIZE: '40'
    ports: ['3000:3000']
    depends_on:
      migrate:
        condition: service_completed_successfully

  publisher:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: publisher
      DATABASE_POOL_SIZE: '5'
    ports: ['3001:3000']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy

  worker:
    <<: *app
    deploy:
      replicas: 2
    environment:
      <<: *app-env
      APP_ROLE: worker
      PROVIDERS_FILE: /config/providers.json
      DATABASE_POOL_SIZE: '40'
      WORKER_KEY_CONCURRENCY: '64'
      WORKER_PARTITION_CONCURRENCY: '6'
    volumes:
      - ./config/providers.json:/config/providers.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- simulated providers (same image, no dependencies) ---------------------------------
  sms-alpha:
    <<: *mock
    environment: { PROVIDER_NAME: sms-alpha, LATENCY_MS: '60', JITTER_MS: '30', FAILURE_RATE: '0.01' }
    ports: ['8091:8080']
  sms-beta:
    <<: *mock
    environment: { PROVIDER_NAME: sms-beta, LATENCY_MS: '90', JITTER_MS: '40', FAILURE_RATE: '0.02' }
    ports: ['8092:8080']
  email-alpha:
    <<: *mock
    environment: { PROVIDER_NAME: email-alpha, LATENCY_MS: '40', JITTER_MS: '20' }
    ports: ['8093:8080']
  email-beta:
    <<: *mock
    environment: { PROVIDER_NAME: email-beta, LATENCY_MS: '70', JITTER_MS: '30' }
    ports: ['8094:8080']
  whatsapp-alpha:
    <<: *mock
    environment: { PROVIDER_NAME: whatsapp-alpha, LATENCY_MS: '120', JITTER_MS: '60', FAILURE_RATE: '0.005' }
    ports: ['8095:8080']
  push-alpha:
    <<: *mock
    environment: { PROVIDER_NAME: push-alpha, LATENCY_MS: '25', JITTER_MS: '10' }
    ports: ['8096:8080']

  # --- observability --------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=2d']
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ['9090:9090']

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3030:3000']
    depends_on: [prometheus]
