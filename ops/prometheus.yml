global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:3000']
  - job_name: publisher
    static_configs:
      - targets: ['publisher:3000']
  # Docker's DNS returns one A record per replica, so every worker is scraped.
  - job_name: worker
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 3000
