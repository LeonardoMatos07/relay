# Simulated providers, same image as the app (node dist/mock-provider/main.js).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-alpha
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sms-alpha }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sms-alpha }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: mock
          image: relay
          command: ['node', 'dist/mock-provider/main.js']
          env:
            - { name: PROVIDER_NAME, value: sms-alpha }
            - { name: LATENCY_MS, value: '60' }
            - { name: JITTER_MS, value: '30' }
            - { name: FAILURE_RATE, value: '0.01' }
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 100m, memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sms-alpha
spec:
  selector: { app.kubernetes.io/name: sms-alpha }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-beta
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sms-beta }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sms-beta }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: mock
          image: relay
          command: ['node', 'dist/mock-provider/main.js']
          env:
            - { name: PROVIDER_NAME, value: sms-beta }
            - { name: LATENCY_MS, value: '90' }
            - { name: JITTER_MS, value: '40' }
            - { name: FAILURE_RATE, value: '0.02' }
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 100m, memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sms-beta
spec:
  selector: { app.kubernetes.io/name: sms-beta }
  ports: [{ port: 8080, targetPort: 8080 }]
