# Development-only dependencies: single replicas, no persistence guarantees.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redpanda }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redpanda }
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
          args:
            - redpanda
            - start
            - --kafka-addr=internal://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:9092
            - --smp=1
            - --memory=1G
            - --mode=dev-container
            - --default-log-level=warn
          ports: [{ containerPort: 9092 }]
          readinessProbe:
            exec: { command: ['sh', '-c', "rpk cluster health | grep -E 'Healthy:.+true'"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 1280Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
spec:
  selector: { app.kubernetes.io/name: redpanda }
  ports: [{ port: 9092, targetPort: 9092 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ['-c', 'max_connections=300']
          env:
            - { name: POSTGRES_USER, value: relay }
            - { name: POSTGRES_PASSWORD, value: relay }
            - { name: POSTGRES_DB, value: relay }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ['pg_isready', '-U', 'relay'] }
            periodSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ['redis-server', '--save', '', '--appendonly', 'no']
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
