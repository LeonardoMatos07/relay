# Runs the forward-only migrations. In a real pipeline this runs before each rollout
# (e.g. an Argo CD PreSync hook); migrations take an advisory lock, so a rerun is harmless.
apiVersion: batch/v1
kind: Job
metadata:
  name: relay-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: relay
          envFrom:
            - configMapRef: { name: relay-config }
            - secretRef: { name: relay-secrets }
          env:
            - { name: APP_ROLE, value: migrate }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
