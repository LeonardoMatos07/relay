apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: relay
labels:
  - pairs:
      app.kubernetes.io/part-of: relay
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - migrate-job.yaml
  - api.yaml
  - publisher.yaml
  - worker.yaml
images:
  - name: relay
    newName: relay
    newTag: local
