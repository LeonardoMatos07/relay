# Two replicas, one active: the leader holds a Postgres advisory lock and the standby takes
# over within about a second if it dies. No autoscaling: one publisher batches thousands of
# rows per round trip, and adding active publishers would break per-recipient ordering.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-publisher
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: relay-publisher }
  template:
    metadata:
      labels: { app.kubernetes.io/name: relay-publisher }
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: publisher
          image: relay
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: relay-config }
            - secretRef: { name: relay-secrets }
          env:
            - { name: APP_ROLE, value: publisher }
            - { name: DATABASE_POOL_SIZE, value: '5' }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 200m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
